name: Package Pure Black Neon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint del código (ESLint)
        run: npm run lint

      - name: Build (esbuild → build/)
        run: npm run build

      - name: Lint de la extensión (web-ext)
        continue-on-error: true
        run: npm run lint:addons > web-ext-lint.json || true

      - name: Resumen del lint
        if: always()
        run: |
          if [ -f web-ext-lint.json ]; then
            node -e "const r=require('./web-ext-lint.json');const t=(r.errors||[]).length,w=(r.warnings||[]).length;console.log('web-ext lint: '+t+' errores, '+w+' avisos');"
          else
            echo 'sin informe de lint'
          fi

      - name: Empaquetar .xpi
        run: npx web-ext build --source-dir build --artifacts-dir dist --overwrite-dest

      - name: Metadatos del build
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./build/manifest.json').version)")
          ZIP=$(ls dist/*.zip | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Subir artifact (.zip)
        uses: actions/upload-artifact@v7
        with:
          name: pure-black-neon-xpi
          path: dist/*.zip

      - name: Subir informe de lint
        if: always() && hashFiles('web-ext-lint.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: web-ext-lint-report
          path: web-ext-lint.json

      - name: Resumen del job
        if: always()
        run: |
          {
            echo "## Pure Black Neon — resumen del build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Versión** | ${{ steps.meta.outputs.version }} |"
            echo "| **Paquete** | ${{ steps.meta.outputs.zip_name }} |"
            if [ -f web-ext-lint.json ]; then
              node -e "const r=require('./web-ext-lint.json');const t=(r.errors||[]).length,w=(r.warnings||[]).length;console.log('| **web-ext lint** | '+t+' errores, '+w+' avisos |')"
              node -e "
                const r=require('./web-ext-lint.json');
                const items=[...(r.errors||[]),...(r.warnings||[])];
                if(items.length){
                  console.log('');
                  console.log('### Detalle del lint');
                  console.log('');
                  for(const it of items){
                    const sev=(it._code&&String(it._code).startsWith('SYNTAX'))?'error':'aviso';
                    console.log('- ['+sev+'] '+(it.code||'?')+' — '+(it.message||''));
                    if(it.file) console.log('  - archivo: \\`'+it.file+'\\`');
                  }
                }"
            else
              echo "| **web-ext lint** | sin informe |"
            fi
            echo ""
            echo "El .xpi del artifact **pure-black-neon-xpi** sale del directorio \`build/\` generado por esbuild."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Descargar .xpi
        uses: actions/download-artifact@v8
        with:
          name: pure-black-neon-xpi
          path: dist

      - name: Renombrar .zip a .xpi
        run: |
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.zip}.xpi"
          done

      - name: Adjuntar al release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.xpi
          generate_release_notes: true
          body: |
            Pure Black Neon v${{ needs.lint-and-package.outputs.version }}
            Instala en Firefox: abre el .xpi en about:addons → Engranaje → "Instalar complemento desde archivo…"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-auto:
    # Publica (o actualiza) el release v<versión de manifest.json> en cada push a main/master
    # o ejecución manual. Si la versión ya tiene release, solo se reemplaza el .xpi adjunto.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: lint-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Descargar .xpi
        uses: actions/download-artifact@v8
        with:
          name: pure-black-neon-xpi
          path: dist

      - name: Renombrar .zip a .xpi
        run: |
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.zip}.xpi"
          done

      - name: Crear o actualizar release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.lint-and-package.outputs.version }}
          name: Pure Black Neon v${{ needs.lint-and-package.outputs.version }}
          files: dist/*.xpi
          generate_release_notes: true
          body: |
            Instala en Firefox: abre el .xpi en about:addons → Engranaje → "Instalar complemento desde archivo…"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
